[build]
  publish = "build/web"

[[headers]]
  for = "/*"
  [headers.values]
    # MUST be allow-popups, or signInWithPopup silently fails. No COEP header:
    # the old one was only for the wasm renderer, which dart:html rules out anyway.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
