  <!-- Loading screen: pure CSS, paints before the engine boots. Compositor-only
       animations (transform/opacity) for slow connections. -->
  <style>
    :root { --bg: #F2F2EF; --ink: #17170F; --soft: #45453C; --muted: #55554C;
            --quiet: #8A8A7E; --quieter: #9E9E92; --track: #E2E2DA; --bead: #2C7A62; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0D0D0C; --ink: #F4F4EF; --soft: #BDBDB2; --muted: #ADADA2;
              --quiet: #84847A; --quieter: #6E6E63; --track: #2A2A26; --bead: #7FC9A8; }
    }
    html, body { margin: 0; padding: 0; background: var(--bg); }
    #ptr-loading { position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 32px; box-sizing: border-box; font-family: Montserrat, system-ui, sans-serif;
      transition: opacity .28s ease-out; }
    #ptr-loading.ptr-done { opacity: 0; pointer-events: none; }
    .ptr-word { display: flex; align-items: baseline; gap: 1px; margin-bottom: 9px;
      font-size: 34px; letter-spacing: -1.4px; }
    .ptr-word b { font-weight: 800; } .ptr-word span { font-weight: 400; color: var(--soft); }
    .ptr-tag { margin: 0 0 30px; text-align: center; font-size: 13.5px; font-weight: 500;
      line-height: 1.5; color: var(--muted); max-width: 270px; }
    .ptr-bar { width: 148px; height: 4px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .ptr-sweep { width: 34%; height: 4px; border-radius: 3px; background: var(--bead); }
    .ptr-status { display: flex; align-items: center; gap: 7px; margin-top: 15px; font-size: 11.5px;
      font-weight: 600; letter-spacing: .2px; color: var(--quieter); }
    .ptr-dots { display: flex; gap: 3px; }
    .ptr-dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
    .ptr-seo { position: absolute; left: 32px; right: 32px; bottom: 40px; text-align: center; }
    .ptr-seo h1 { margin: 0 0 5px; font-size: 11.5px; font-weight: 600; color: var(--quiet); line-height: 1.45; }
    .ptr-seo p { margin: 0; font-size: 10.5px; font-weight: 500; color: var(--quieter); line-height: 1.5; }

    @keyframes ptr-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes ptr-swing { 0%,100% { transform: rotate(-11deg) } 50% { transform: rotate(11deg) } }
    @keyframes ptr-sweep { 0% { transform: translateX(-100%) } 100% { transform: translateX(300%) } }
    @keyframes ptr-fade  { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .ptr-mark  { margin-bottom: 26px; animation: ptr-float 3.2s cubic-bezier(.45,0,.55,1) infinite; }
    .ptr-cord  { animation: ptr-swing 1.9s cubic-bezier(.45,0,.55,1) infinite;
                 transform-box: view-box; transform-origin: 40px 17px; }
    .ptr-sweep { animation: ptr-sweep 1.5s cubic-bezier(.65,0,.35,1) infinite; }
    .ptr-dot   { animation: ptr-fade 1.5s ease-in-out infinite; }
    .ptr-dot:nth-child(2) { animation-delay: .18s }
    .ptr-dot:nth-child(3) { animation-delay: .36s }
    @media (prefers-reduced-motion: reduce) {
      .ptr-mark, .ptr-cord, .ptr-sweep, .ptr-dot { animation: none; }
      .ptr-sweep { transform: none; width: 100%; opacity: .45; }
      #ptr-loading { transition: none; }
    }
    /* iOS Safari zooms into any focused field under 16px and Flutter then
       blocks pinch-out, leaving the page stuck zoomed. Flutter draws the text
       itself; this only sizes its hidden input, so nothing visible changes. */
    input, textarea { font-size: 16px !important; }

<script>
  // Fade, don't snap: the handoff to the app should not visibly jump.
  // The engine dispatches this on window; it never reaches document.
  window.addEventListener('flutter-first-frame', function () {

    el.classList.add('ptr-done');
    setTimeout(function () { el.setAttribute('aria-hidden', 'true'); el.style.visibility = 'hidden'; }, 320);
