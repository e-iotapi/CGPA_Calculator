name: cgpa_calculator
description: "Pointer — the CGPA calculator for BITS Pilani, Goa and Hyderabad."
publish_to: 'none'
version: 2.3.1+131

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.1.14
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Regenerate lib/course.g.dart after changing the Course model.
  hive_generator: ^2.0.0
  build_runner: ^2.1.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
    # Full weight range for the rebuilt screens (TypeScale.family). Kept
    # separate so the legacy screens, which only ever had SemiBold under
    # "Montserrat", do not change weight until they are replaced.
    # Licence: fonts/OFL.txt
    - family: MontserratFull
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-ExtraBold.ttf
          weight: 800
