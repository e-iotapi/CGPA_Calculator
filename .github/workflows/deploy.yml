name: deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # Mirrors check.yml's job (T7): needs cannot cross workflow files, and
  # check.yml must still run standalone on PRs. Keep the two in sync.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: flutter pub get
      - name: flutter analyze (no new issues vs. tools/analyze_baseline.txt)
        run: |
          flutter analyze --no-fatal-infos > /tmp/analyze.out 2>&1 || true
          cat /tmp/analyze.out
          node tools/check_analyze_baseline.mjs < /tmp/analyze.out
      - run: flutter test
      - name: firestore.rules tests
        run: |
          cd test/rules
          npm ci
          npm test
      - name: production build + prod guard (T1)
        run: |
          flutter build web --release --base-href /calculator/ \
            --dart-define=POINTER_HEADS_URL=${{ vars.PROD_POINTER_HEADS_URL }} \
            --dart-define=POINTER_LIVE_URL=${{ vars.PROD_POINTER_LIVE_URL }}
          if grep -q 'pointer-test-only' build/web/main.dart.js; then
            echo "Test-only sign-in leaked into the production build." >&2
            exit 1
          fi

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Prod's Worker URLs (not staging's POINTER_* vars); unset, they build
      # empty and the app reads heads from Firestore with no live push.
      - run: |
          flutter build web --release --base-href /calculator/ \
            --dart-define=POINTER_HEADS_URL=${{ vars.PROD_POINTER_HEADS_URL }} \
            --dart-define=POINTER_LIVE_URL=${{ vars.PROD_POINTER_LIVE_URL }}
      # The landing page at /, the app under /calculator/ (ARCHITECTURE.md §7).
      # Installs from before the move registered a service worker at the
      # root; Flutter's own worker is the self-unregistering one, so a copy
      # there retires them.
      - run: |
          mkdir site
          cp -r landing/. site/
          cp -r web/icons web/favicon.png site/
          cp -r build/web site/calculator
          cp build/web/flutter_service_worker.js site/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pointer-bits-pilani --branch=master
